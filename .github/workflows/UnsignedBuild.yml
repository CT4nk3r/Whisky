name: Unsigned Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned Whisky.app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: |
          xcodebuild -project Whisky.xcodeproj \
            -scheme Whisky \
            -configuration Debug \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package app
        run: |
          app=$(xcodebuild -project Whisky.xcodeproj -scheme Whisky -configuration Debug \
            -showBuildSettings 2>/dev/null \
            | awk -F' = ' '
                /^ *BUILT_PRODUCTS_DIR = /  { dir = $2 }
                /^ *FULL_PRODUCT_NAME = /   { name = $2 }
                END { if (dir != "" && name != "") print dir "/" name }')
          [ -d "$app" ] || { echo "::error::Whisky.app was not built"; exit 1; }
          mkdir -p unsigned-build
          ditto -c -k --sequesterRsrc --keepParent "$app" unsigned-build/Whisky-unsigned.zip

      - name: Upload unsigned app
        uses: actions/upload-artifact@v5
        with:
          name: Whisky-unsigned
          path: unsigned-build/Whisky-unsigned.zip
          if-no-files-found: error
          retention-days: 14
